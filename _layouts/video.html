---
layout: default
---

<article class="video-gallery">

    <h1>{{ page.title }}</h1>

    {% if page.subtitle %}
        <h2>{{ page.subtitle }}</h2>
    {% endif %}

    {{ content }}

    <div class="video-gallery-grid">

        {% for video in page.videos %}

            <div class="video-gallery-item">

                <div
                    class="video-embed spisotti-consent-youtube"
                    data-video="{{ video.id }}">

                    <img
                        src="{{ '/images/video/youtube-' | append: video.id | append: '.jpg' | relative_url }}"
                        alt="{{ video.title | default: 'Video Shirin Dance Company' }}"
                        loading="lazy"
                        decoding="async">

                    <button
                        type="button"
                        class="video-play"
                        aria-label="Riproduci {{ video.title | default: 'il video' }}">
                        ▶
                    </button>

                </div>

                {% if video.title %}
                    <h3>{{ video.title }}</h3>
                {% endif %}

                {% if video.description %}
                    <p>{{ video.description }}</p>
                {% endif %}

            </div>

        {% endfor %}

    </div>

</article>

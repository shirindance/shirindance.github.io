name: Aggiorna informativa privacy

on:
  workflow_dispatch:

  schedule:
    - cron: "0 5 * * *"

jobs:

  sync:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Scarica il repository Shirin
        uses: actions/checkout@v6

      - name: Scarica il template privacy
        run: |
          curl -L \
            "https://raw.githubusercontent.com/glispisotti/glispisotti/main/consent/privacy.html" \
            -o privacy.html

      - name: Controlla se privacy.html è cambiato
        id: changes
        run: |
          if git diff --quiet privacy.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Salva l'aggiornamento
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add privacy.html
          git commit -m "Aggiorna informativa privacy"
          git push